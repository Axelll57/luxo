<!DOCTYPE html>

<head>

<meta name="theme-color" content="#00a3e0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luxo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<header class="top">
  <button class="logo" data-go="home" aria-label="Accueil"><img src="icons/icon-192.png" alt="">Luxo</button>
  <span class="chip streak" title="Série de jours"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="#ff9600"/><path d="M12 13c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1.5 1-2.5 3-5z" fill="#ffd34d"/></svg><b id="sStreak">0</b></span>
  <span class="chip" title="XP"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#00a3e0"/></svg><b id="sXp">0</b></span>
  <span class="chip" title="Cœurs du jour"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z" fill="#ef3340"/></svg><b id="sLives">5</b></span>
  <button class="menu" id="mBtn" aria-label="Options">⋯</button>
</header>
<div id="update" class="update" hidden><span>Nouvelle version disponible</span><button id="updBtn">Mettre à jour</button></div>
<main id="app"><p class="loading">Chargement…</p></main>
<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-live="polite"></section>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
